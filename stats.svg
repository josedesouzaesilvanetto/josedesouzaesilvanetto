<svg width="495" height="205" viewBox="0 0 495 205" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="statsTitle statsDesc">
  <title id="statsTitle">Estatísticas GitHub de José Neto, Rank: A+</title>
  <desc id="statsDesc">Contribuições no último ano: 690, Total de Commits: 853, Repositórios: 48, Contribuições privadas: 677</desc>
  <defs>
    <linearGradient id="statsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#111927"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#005CA9"/>
      <stop offset="100%" stop-color="#79FF97"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="494" height="204" rx="8" fill="url(#statsBg)" stroke="#30363D" stroke-width="1"/>
  <rect x="1" y="1" width="493" height="4" rx="2" fill="url(#ringGrad)"/>

  <!-- Cabecalho -->
  <text x="24" y="32" fill="#F0F6FC" font-family="'Segoe UI', Ubuntu, -apple-system, sans-serif" font-size="16.5" font-weight="700">
    José Neto • Engenharia &amp; Produtividade
  </text>
  <text x="24" y="49" fill="#8B949E" font-family="'Segoe UI', Ubuntu, -apple-system, sans-serif" font-size="11.5" font-weight="500">
    Atividade Consolidada via GitHub GraphQL (Público + Privado)
  </text>
  <line x1="24" y1="59" x2="471" y2="59" stroke="#21262D" stroke-width="1"/>

  <!-- Linhas de Metricas -->
  <g transform="translate(24, 72)" font-family="'Segoe UI', Ubuntu, -apple-system, sans-serif" font-size="13.5">
    <!-- Linha 1: Contribuicoes (Ano) -->
    <g transform="translate(0, 0)">
      <circle cx="7" cy="8" r="4.5" fill="#79FF97"/>
      <text x="22" y="12.5" fill="#C9D1D9" font-weight="600">Contribuições (Último Ano):</text>
      <text x="245" y="12.5" fill="#FFFFFF" font-weight="700" data-testid="contribs">690</text>
    </g>

    <!-- Linha 2: Total de Commits (Branches) -->
    <g transform="translate(0, 26)">
      <circle cx="7" cy="8" r="4.5" fill="#38BDF8"/>
      <text x="22" y="12.5" fill="#C9D1D9" font-weight="600">Total de Commits (Branches):</text>
      <text x="245" y="12.5" fill="#38BDF8" font-weight="700" data-testid="commits">853</text>
    </g>

    <!-- Linha 3: Contribuicoes Privadas -->
    <g transform="translate(0, 52)">
      <circle cx="7" cy="8" r="4.5" fill="#0088CC"/>
      <text x="22" y="12.5" fill="#C9D1D9" font-weight="600">Commits Corporativos Privados:</text>
      <text x="245" y="12.5" fill="#F0F6FC" font-weight="700">677 (98%)</text>
    </g>

    <!-- Linha 4: Repositorios Ativos -->
    <g transform="translate(0, 78)">
      <circle cx="7" cy="8" r="4.5" fill="#F59E0B"/>
      <text x="22" y="12.5" fill="#C9D1D9" font-weight="600">Repositórios sob Gestão:</text>
      <text x="245" y="12.5" fill="#F0F6FC" font-weight="700">48 (46 priv.)</text>
    </g>

    <!-- Linha 5: Historico Acumulado -->
    <g transform="translate(0, 104)">
      <circle cx="7" cy="8" r="4.5" fill="#A855F7"/>
      <text x="22" y="12.5" fill="#C9D1D9" font-weight="600">Total Acumulado na Conta:</text>
      <text x="245" y="12.5" fill="#F0F6FC" font-weight="700">700</text>
    </g>
  </g>

  <!-- Anel de Rank A+ -->
  <g transform="translate(418, 126)">
    <circle cx="0" cy="0" r="42" fill="#161B22" stroke="#21262D" stroke-width="6"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#ringGrad)" stroke-width="6"
            stroke-dasharray="263.89" stroke-dashoffset="28" stroke-linecap="round"
            transform="rotate(-90)"/>
    <text x="0" y="-2" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF"
          font-family="'Segoe UI', Ubuntu, -apple-system, sans-serif" font-size="24" font-weight="800" data-testid="level-rank-icon">
      A+
    </text>
    <text x="0" y="18" text-anchor="middle" fill="#79FF97"
          font-family="'Segoe UI', Ubuntu, -apple-system, sans-serif" font-size="10" font-weight="700">
      TOP TIER
    </text>
  </g>
</svg>
