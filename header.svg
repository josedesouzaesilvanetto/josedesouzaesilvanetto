<svg width="854" height="200" viewBox="0 0 854 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">José Neto - Arquiteto e Cientista de Dados</title>
  <desc id="bannerDesc">Banner institucional de engenharia de dados, business intelligence e inteligencia artificial.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060D1A"/>
      <stop offset="45%" stop-color="#0B2144"/>
      <stop offset="80%" stop-color="#005CA9"/>
      <stop offset="100%" stop-color="#0088CC"/>
    </linearGradient>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#005CA9" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#00A8E8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0077CC" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0F2027" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#005CA9" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#79FF97" stop-opacity="1"/>
      <stop offset="75%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#005CA9" stop-opacity="0"/>
    </linearGradient>
    <pattern id="techGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#38BDF8" stroke-width="0.6" stroke-opacity="0.08"/>
    </pattern>
    <clipPath id="bannerClip">
      <rect x="0" y="0" width="854" height="200" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bannerClip)">
    <rect x="0" y="0" width="854" height="200" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="854" height="200" fill="url(#techGrid)"/>

    <!-- Rede geometrica decorativa de dados -->
    <g stroke="#38BDF8" stroke-opacity="0.18" stroke-width="1">
      <line x1="55" y1="38" x2="125" y2="62"/>
      <line x1="125" y1="62" x2="90" y2="115"/>
      <line x1="125" y1="62" x2="195" y2="42"/>
      <line x1="780" y1="45" x2="710" y2="75"/>
      <line x1="710" y1="75" x2="755" y2="128"/>
      <line x1="710" y1="75" x2="645" y2="40"/>
    </g>
    <g fill="#38BDF8" fill-opacity="0.35">
      <circle cx="55" cy="38" r="3"/>
      <circle cx="125" cy="62" r="4"/>
      <circle cx="90" cy="115" r="2.5"/>
      <circle cx="195" cy="42" r="2.5"/>
      <circle cx="780" cy="45" r="3"/>
      <circle cx="710" cy="75" r="4"/>
      <circle cx="755" cy="128" r="2.5"/>
      <circle cx="645" cy="40" r="2.5"/>
    </g>

    <!-- Ondas dinamicas SMIL -->
    <path d="M0 140 Q 213.5 175 427 148 T 854 155 L 854 200 L 0 200 Z" fill="url(#waveGrad1)">
      <animate attributeName="d" dur="16s" repeatCount="indefinite"
        values="M0 140 Q 213.5 175 427 148 T 854 155 L 854 200 L 0 200 Z;
                M0 152 Q 213.5 125 427 160 T 854 138 L 854 200 L 0 200 Z;
                M0 140 Q 213.5 175 427 148 T 854 155 L 854 200 L 0 200 Z"/>
    </path>
    <path d="M0 158 Q 213.5 132 427 165 T 854 148 L 854 200 L 0 200 Z" fill="url(#waveGrad2)">
      <animate attributeName="d" dur="22s" repeatCount="indefinite"
        values="M0 158 Q 213.5 132 427 165 T 854 148 L 854 200 L 0 200 Z;
                M0 145 Q 213.5 178 427 142 T 854 168 L 854 200 L 0 200 Z;
                M0 158 Q 213.5 132 427 165 T 854 148 L 854 200 L 0 200 Z"/>
    </path>

    <!-- Tag superior institucional -->
    <rect x="237" y="24" width="380" height="24" rx="12" fill="#0D1B2A" fill-opacity="0.72" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1"/>
    <text x="427" y="40" text-anchor="middle" fill="#7DD3FC" font-family="'Segoe UI', Ubuntu, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">
      DATA ARCHITECTURE  |  ANALYTICS  |  APPLIED AI
    </text>

    <!-- Nome principal e cargo (opacity 1 estrito) -->
    <text x="427" y="96" text-anchor="middle" fill="#FFFFFF" font-family="'Segoe UI', Ubuntu, -apple-system, sans-serif" font-size="46" font-weight="800" letter-spacing="0.5">
      José Neto
    </text>
    <text x="427" y="130" text-anchor="middle" fill="#E0F2FE" font-family="'Segoe UI', Ubuntu, -apple-system, sans-serif" font-size="19" font-weight="500" letter-spacing="0.4">
      Arquiteto e Cientista de Dados  •  Engenharia de Analytics e IA
    </text>

    <!-- Linha de destaque central -->
    <rect x="247" y="146" width="360" height="2.5" rx="1.25" fill="url(#accentLine)"/>

    <!-- Borda externa sutil -->
    <rect x="0.5" y="0.5" width="853" height="199" rx="11.5" fill="none" stroke="#38BDF8" stroke-opacity="0.28" stroke-width="1"/>
  </g>
</svg>
